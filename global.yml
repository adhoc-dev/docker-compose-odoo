version: "3.9"
services:
    traefik:
        image: traefik:2.5
        command:
            - --providers.docker
            - --entrypoints.web.address=:80
        ports:
            - 80:80
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        restart: unless-stopped
        networks:
            adhoc:
    dns:
        image: cytopia/bind
        environment:
            WILDCARD_DNS: loc=172.20.0.1
            DNS_FORWARDER: 127.0.0.11
        ports:
            - 127.0.0.1:53:53/tcp
            - 127.0.0.1:53:53/udp
        restart: unless-stopped
        networks:
            adhoc:
                ipv4_address: 172.20.0.10

networks:
    adhoc:
        external: false
        name: adhoc
        ipam:
            config:
                - subnet: 172.20.0.0/24
