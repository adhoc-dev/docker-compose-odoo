version: "3.9"
services:
    db:
        image: postgres:12
        environment:
            - POSTGRES_USER=odoo
            - POSTGRES_PASSWORD=odoo
            - POSTGRES_DB=postgres
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - pg_data:/var/lib/postgresql/data/pgdata
        networks:
            adhoc:

    odoo:
        image: $ODOO_IMAGE:$ODOO_MINOR
        external_links:
            - traefik:traefik
        depends_on:
            - db
        volumes:
            - ./data/custom:/home/odoo/custom
            - default:/home/odoo/src
            - odoo_data:/home/odoo/data
        labels:
            - traefik.enable=true
            - traefik.http.routers.odoo.rule=HostRegexp(`${DOMAIN}`,`{subdomain:[a-z]+}.${DOMAIN}`)
            - traefik.http.services.odoo.loadbalancer.server.port=8069
            - traefik.http.routers.odoo.entrypoints=web
        dns:
            - 172.20.0.10
        networks:
            adhoc:
                ipv4_address: 172.20.0.5
volumes:
    pg_data:
    odoo_data:
    default:

networks:
    adhoc:
        external: true
        name: adhoc
