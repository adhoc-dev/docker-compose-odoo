version: '2.1'
services:
    db:
        image: postgres:12
        environment:
            - POSTGRES_USER=odoo
            - POSTGRES_PASSWORD=odoo
            - POSTGRES_DB=postgres
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - pg_data:/var/lib/postgresql/data/pgdata
        network_mode: "bridge"
    odoo:
        # user: root
        build:
            context: .
            dockerfile: Dockerfile
        # image: $ODOO_IMAGE:$ODOO_MINOR
        external_links:
            - traefik:traefik
            - aeroo:aeroo
        # si usamos network_mode entonces el depends_on no funciona, necesitamos link
        # depends_on:
        #     # - proxy
        #     - db
        links:
            - db:db
        volumes:
            - ./data/custom:/home/odoo/custom
            - default:/home/odoo/src
            - odoo_data:/home/odoo/data
        labels:
            - traefik.enable=true
            - traefik.http.routers.odoo.rule=HostRegexp(`${DOMAIN}`,`{subdomain:[a-z]+}.${DOMAIN}`)
            - traefik.http.services.odoo.loadbalancer.server.port=8069
            - traefik.http.routers.odoo.entrypoints=web
        dns:
            - 172.20.0.10
        networks:
            adhoc:
                ipv4_address: 172.20.0.5
        environment:
            CUSTOM_CONFIG: |-
                [options]
            CUSTOM_REQUIREMTNS: |-
                # custom pip librearies
            CUSTOM_ENTRYPOINT: |-
                #!/bin/bash
                # pip install --user --no-cache-dir -e /home/odoo/custom/odoo
                # pip install --user --no-cache-dir pyopenssl
        env_file:
            - .env
        # para, por ejemplo, odoo-saas. para que el container resuelva tmb .localhost en esta ip
volumes:
    pg_data:
    odoo_data:
    default:

networks:
    adhoc:
        external: true
        name: adhoc
        # ipam:
        #     config:
        #         - subnet: 172.20.0.0/24
